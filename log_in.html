    <body class="d-flex flex-column min-vh-100">
        <header>
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid px-4">
                    <a class="navbar-brand" href="index.html">Into The Under</a>
                    <!-- <div class="collapse navbar-collapse" id="navbarSupportedContent"> -->
                    <div class="d-flex">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                            <li class="nav-item"><a href="download.html" class="nav-link">Download</a></li>

                                    <li><a class="dropdown-item" href="sign_up.html">Sign Up</a></li>

                                </ul>
                                
                            </li>
                        </ul>
                    <!-- </div> -->
                    </div>
                </div>
            </nav>
        </header>

        <main class="py-4 flex-grow-1">
            
            <div class="container">
                <div class="row g-4">
                    <div class="col-10 col-md-6 mx-auto">

                        <div class="card shadow-sm">
                            <div class="card-header">
                                <h4 class="h-4">Log in</h4>
                            </div>
                            <div class="card-body">
                                <form action="profile.html" method="post">
                                    <div class="mb-4 text-muted">create a new account <a href="sign_up.html">here</a>!</div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input id="email" type="email" name="email" class="form-control" placeholder="name@example.com" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <input id="password" type="password" name="password" class="form-control" placeholder="enter password here" required>
                                    </div>

                                    <br class="my-3">

                                    <div class="mb-3">
                                        <button type="submit" class="btn btn-primary w-100">Log in</button>
                                    </div>

                                    <div class="mb-3">
                                        <button id="google_login" class="btn btn-outline-secondary w-100">Log in With Google</button>
                                    </div>

                                </form>        
                            </div>
                        </div>

            
                    </div>
                </div>
            </div>

        </main>

        
        <footer class="bg-light text-dark">
            <div class="container py-4">
